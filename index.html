<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum Cloud Computing - Vercel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .wrapper {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 450px;
            width: 100%;
            border: 1px solid #334155;
        }
        .status-badge {
            background-color: #065f46;
            color: #34d399;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.5rem;
            color: #f1f5f9;
            margin-bottom: 12px;
        }
        p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .info-card {
            background-color: #0f172a;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: left;
            font-size: 0.9rem;
            color: #cbd5e1;
        }
        .info-card p {
            margin-bottom: 6px;
            color: #cbd5e1;
        }
        .btn-action {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-action:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="status-badge">Deployment Active</div>
        <h1>Tugas Praktikum Cloud Computing</h1>
        <p>Deployment Static Web Apps menggunakan Vercel dan integrasi GitHub Repository.</p>
        
        <div class="info-card">
            <p><strong>Nama:</strong> Alvin Dito Primayudha</p>
            <p><strong>Status:</strong> Praktikum Modul 01</p>
            <p id="time-container"></p>
        </div>

        <button class="btn-action" onclick="alert('Halo, web server berjalan dengan normal!')">Uji Koneksi</button>
    </div>

    <script>
        const d = new Date();
        document.getElementById('time-container').innerHTML = '<strong>Waktu Akses:</strong> ' + d.toLocaleString('id-ID');
    </script>
</body>
</html>
